name: Phase 4 - CI/CD to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - "phase-3/**"
      - ".github/workflows/phase4-ci-cd.yml"

  pull_request:
    branches:
      - main
    paths:
      - "phase-3/**"

jobs:

  # =========================
  # Job 1: Lint and Test
  # =========================
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r phase-3/requirements-dev.txt

      - name: Run Flake8
        run: |
          flake8 phase-3/app phase-3/test_main.py --max-line-length=100

      - name: Run tests
        run: |
          pytest -v phase-3/test_main.py


  # =========================
  # Job 2: Build and Push
  # =========================
  build-and-push:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./phase-3
          file: ./phase-3/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/containerized-fastapi-cicd:latest