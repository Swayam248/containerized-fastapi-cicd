name: Phase 3 CI

on:
  push:
    branches:
      - main
    paths:
      - "phase-3/**"
      - ".github/workflows/phase3-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "phase-3/**"
      - ".github/workflows/phase3-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r phase-3/requirements-dev.txt

      - name: Run Flake8
        run: |
          flake8 phase-3/app phase-3/test_main.py --max-line-length=100

      - name: Run tests
        run: |
          pytest -v phase-3/test_main.py

  build-image:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./phase-3
          file: ./phase-3/Dockerfile
          push: false
          tags: docker-mastery:phase3